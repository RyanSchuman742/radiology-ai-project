<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chest X-ray Interpretability{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M12 3v7"/>
          <path d="M12 10c-1.5 1-3 1.2-4.5 1C6 14 5 17 5.5 20c.2 1 1.2 1.5 2 1 2-1.2 3.5-3.5 4.5-6"/>
          <path d="M12 10c1.5 1 3 1.2 4.5 1 1.5 3 2.5 6 2 9-.2 1-1.2 1.5-2 1-2-1.2-3.5-3.5-4.5-6"/>
        </svg>
      </span>
      <span class="brand-name">Chest X-ray Interpretability</span>
      <span class="brand-tag">Research</span>
    </a>
    <span class="notice">Research prototype — not a medical device, not for clinical use</span>
  </header>

  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
